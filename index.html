<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System OS & PvP Hub - Santa Claus 2027</title>
    <style>
        body {
            background-color: #06080f;
            color: #00ffcc;
            font-family: monospace;
            padding: 15px;
            margin: 0;
        }
        .os-container {
            max-width: 600px;
            margin: 0 auto;
            background: #0d1322;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(0,255,204,0.25);
        }
        .os-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff3366;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .os-header h2 {
            color: #ff3366;
            margin: 0;
            font-size: 18px;
            text-shadow: 0 0 8px rgba(255,51,102,0.4);
        }
        .status-badge {
            background: #00ffcc;
            color: #06080f;
            padding: 3px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
        }
        .section-title {
            color: #ffcc00;
            margin-top: 15px;
            margin-bottom: 10px;
            font-size: 15px;
            border-bottom: 1px dashed #334e68;
            padding-bottom: 5px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .os-btn {
            background-color: #1a2639;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .os-btn:hover {
            background-color: #00ffcc;
            color: #06080f;
        }
        .pvp-btn {
            border-color: #ff3366;
            color: #ff3366;
        }
        .pvp-btn:hover {
            background-color: #ff3366;
            color: #fff;
        }
        .launch-btn {
            background-color: #00ffcc;
            color: #06080f;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .launch-btn:hover {
            background-color: #ff3366;
            color: #fff;
        }
        #terminal-logs {
            background-color: #000;
            color: #00ff00;
            padding: 12px;
            height: 160px;
            overflow-y: auto;
            border: 1px dashed #333;
            font-size: 13px;
            border-radius: 6px;
            text-align: left;
            direction: ltr;
        }
    </style>
</head>
<body>

    <div class="os-container">
        <div class="os-header">
            <h2>System Environment OS</h2>
            <div class="status-badge">ACTIVE v14.00</div>
        </div>

        <div class="section-title">ألعاب رياضية وفردية (Single & Sports)</div>
        <div class="game-grid">
            <button class="os-btn" onclick="selectGame('Football_League_2026')">Football League 2026</button>
            <button class="os-btn" onclick="selectGame('EA_FC_FIFA_19')">EA FC / FIFA 19</button>
        </div>

        <div class="section-title" style="color: #ff3366;">ألعاب التنافس والمواجهة المباشرة (PvP Arena)</div>
        <div class="game-grid">
            <button class="os-btn pvp-btn" onclick="selectGame('Online_Match_PvP')">مباريات أونلاين PvP</button>
            <button class="os-btn pvp-btn" onclick="selectGame('Stumble_Guys_PvP')">Stumble Guys (Multiplayer)</button>
        </div>

        <button class="launch-btn" id="launchBtn" onclick="launchGame()">إقلاع وتشغيل العنصر المحدد (Launch)</button>

        <div id="terminal-logs">root@santaclaus:~# System OS ready. Select a game mode to launch...</div>
    </div>

    <script>
        let currentGame = "None";

        function logMessage(msg) {
            const term = document.getElementById('terminal-logs');
            const time = new Date().toLocaleTimeString();
            term.innerHTML += `<br>[${time}] ${msg}`;
            term.scrollTop = term.scrollHeight;
        }

        function selectGame(gameName) {
            currentGame = gameName;
            logMessage(`Target acquired: Selected mode -> [${gameName}]`);
        }

        function launchGame() {
            if (currentGame === "None") {
                logMessage("ERROR: No game mode selected! Please choose one first.");
                return;
            }

            const btn = document.getElementById('launchBtn');
            btn.disabled = true;
            btn.style.opacity = 0.5;

            logMessage(`Initializing network & environment for [${currentGame}]...`);
            setTimeout(() => logMessage("Connecting to secure matchmaking servers... [OK]"), 500);
            setTimeout(() => logMessage("Establishing low-latency PvP connection... [SIMULATED]"), 1000);
            setTimeout(() => {
                logMessage(`SUCCESS: [${currentGame}] session is active and running!`);
                btn.disabled = false;
                btn.style.opacity = 1;
            }, 1500);
        }
    </script>

</body>
  </html>
